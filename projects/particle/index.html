<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle</title>
    <script src="js/jszip.min.js"></script>
    <link rel="stylesheet" href="base/tokens.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="app-container">

    <aside class="sidebar">
        <h1 class="sidebar-title">Image Animator</h1>

        <div class="mb-4 flex-shrink-0">
            <label for="imageUpload" class="label mb-2">Upload Images:</label>
            <div class="input-file-wrapper">
                <input type="file" id="imageUpload" accept="image/*" multiple
                       class="input-file">
            </div>
        </div>

        <div class="sidebar-section">
            <h3 class="sidebar-subtitle">Uploaded Images</h3>
            <div id="imageList" class="mb-2">
                <p class="text-gray-500 text-sm">No images uploaded yet.</p>
            </div>
        </div>

        <div class="sidebar-section">
            <h3 class="sidebar-subtitle">Particle Settings</h3>
            <div class="mb-3">
                 <label for="particleDensity" class="label">Density:</label>
                 <input type="range" id="particleDensity" min="0.1" max="20" value="5" class="input-range">
                 <span class="text-xs text-subtle">Lower is denser (<span id="densityValue">5</span>)</span>
            </div>
             <div class="mb-3">
                 <label for="particleSizeSlider" class="label">Size:</label>
                 <input type="range" id="particleSizeSlider" min="0.1" max="15" step="0.1" value="1.5" class="input-range">
                 <span class="text-xs text-subtle">Size: <span id="particleSizeValue">1.5</span>px</span>
            </div>
             <div class="mb-2">
                 <span class="label">Shape:</span>
                 <div class="flex space-x-4 radio-group">
                     <label class="text-sm text-subtle flex items-center">
                         <input type="radio" id="particleShapeCircle" name="particleShape" value="circle" checked> Circle
                     </label>
                     <label class="text-sm text-subtle flex items-center">
                         <input type="radio" id="particleShapeSquare" name="particleShape" value="square"> Square
                     </label>
                 </div>
             </div>
        </div>

         <div class="sidebar-section">
             <h3 class="sidebar-subtitle">Interaction Settings</h3>
             <div class="mb-3">
                  <label for="mouseRadius" class="label">Interaction Radius:</label>
                  <input type="range" id="mouseRadius" min="1" max="800" value="100" class="input-range">
                  <span class="text-xs text-subtle"><span id="radiusValue">100</span>px</span>
             </div>
              <div class="mb-3">
                  <label for="transitionSpeed" class="label">Effect Speed:</label>
                  <input type="range" id="transitionSpeed" min="1" max="500" value="60" class="input-range">
                  <span class="text-xs text-subtle">Higher is slower (<span id="speedValue">60</span>)</span>
             </div>
              <div class="mb-2">
                  <span class="label">Mode:</span>
                  <div class="flex space-x-4 radio-group">
                      <label class="text-sm text-subtle flex items-center">
                          <input type="radio" id="interactionModeRepel" name="interactionMode" value="repel" checked> Repel
                      </label>
                      <label class="text-sm text-subtle flex items-center">
                          <input type="radio" id="interactionModeAttract" name="interactionMode" value="attract"> Attract
                      </label>
                  </div>
              </div>
         </div>

         <div class="sidebar-section">
             <h3 class="sidebar-subtitle">Path Recording</h3>
             <div class="mb-2">
                <label for="trackingDurationInput" class="label">Tracking Duration (sec):</label>
                <input type="number" id="trackingDurationInput" min="1" max="30" value="5"
                       class="input-number">
             </div>
             <div class="flex space-x-2 mb-2">
                 <button id="recordPathBtn" class="flex-1 button button-green transition">
                   Record Path
                 </button>
                 <button id="replayPathBtn" class="flex-1 button button-blue transition" disabled>
                   Replay Path
                 </button>
             </div>
             <div class="flex items-center">
                 <input type="checkbox" id="showReplayPathCheckbox" checked class="input-checkbox">
                 <label for="showReplayPathCheckbox" class="ml-2 text-sm text-subtle">Show Replay Path</label>
             </div>
        </div>

        <div class="sidebar-section">
             <h3 class="sidebar-subtitle">Animation Recording</h3>
             <div class="mb-2">
                <label for="recordAnimationDurationInput" class="label">Recording Duration (sec):</label>
                <input type="number" id="recordAnimationDurationInput" min="1" max="60" value="5"
                       class="input-number">
             </div>
             <div class="space-y-2 mb-2">
                 <button id="recordAnimationBtn" class="w-full button button-red transition">
                   Record Animation
                 </button>
                 <button id="recordWithReplayBtn" class="w-full button button-orange transition" disabled>
                     Record with Path Replay
                 </button>
                 <button id="downloadRecordingBtn" class="w-full button button-teal transition" disabled>
                   Download ZIP
                 </button>
             </div>
             <div id="animationRecordingStatus"></div>
        </div>

        <div class="sidebar-section">
             <h3 class="sidebar-subtitle">Canvas Video Recording</h3>
             <div class="mb-2">
                <label for="videoRecordingDurationInput" class="label">Recording Duration (sec):</label>
                <input type="number" id="videoRecordingDurationInput" min="1" max="60" value="10"
                       class="input-number">
             </div>
             <div class="space-y-2 mb-2">
                 <button id="recordVideoBtn" class="w-full button button-indigo transition">
                   Record Canvas Video
                 </button>
                 <button id="downloadVideoBtn" class="w-full button button-violet transition" disabled>
                   Download Video
                 </button>
             </div>
             <div id="videoRecordingStatus"></div>
        </div>

        <div class="sidebar-section">
             <h3 class="sidebar-subtitle">Export Current Frame</h3>
             <button id="downloadSvgBtn" class="w-full button button-purple transition">
                 Download SVG
             </button>
        </div>
    </aside>

    <main class="main-content">
        <canvas id="particleCanvas"></canvas>
        <div id="countdownDisplay">3</div>
    </main>

    <script src="script.js" defer></script>

</body>
</html>
