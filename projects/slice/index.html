<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slices by Uninspired Studio</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="style.css">
    <script src="basic-slider.js"></script>

    <!-- Removed inline styles -->
</head>
<body>
    <div class="container">
        <div class="controls">
            <h3 style="margin-top: 0;">Images</h3>
            <div class="control-group"> <label for="imageLoader1">Load Image 1:</label> <input type="file" id="imageLoader1" accept="image/*"> </div>
            <div class="control-group"> <label for="imageLoader2">Load Image 2:</label> <input type="file" id="imageLoader2" accept="image/*"> </div>
            
            <h3>General Settings</h3>
            <div class="control-item">
                <basic-slider id="speedSlider" label="Glitch Speed (FPS)" min="1" max="60" value="0.0667" unit=""></basic-slider>
            </div>
            
            <h3>Appearance</h3>
            <div class="control-item toggle-item">
                <label for="tornEdgeCheckbox" class="toggle-label">Torn Edge Mode</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="tornEdgeCheckbox">
                    <span class="toggle-slider"></span>
                </div>
            </div>
            <div class="control-group" id="jaggedAmpControl" style="display: none;">
                <div class="control-item">
                    <basic-slider id="jaggedAmpSlider" label="Jaggedness Amount (px)" min="0" max="20" value="0.2" unit="px"></basic-slider>
                </div>
            </div>
            <div class="control-group" id="jaggedFreqControl" style="display: none;">
                <div class="control-item">
                    <basic-slider id="jaggedFreqSlider" label="Jaggedness Density" min="0.01" max="0.2" value="0.237" unit=""></basic-slider>
                </div>
            </div>
            <div class="control-item">
                <basic-slider id="rotationSlider" label="Max Rotation" min="0" max="45" value="0" unit="°"></basic-slider>
            </div>
            
            <h3>Horizontal Slices</h3>
            <div class="control-item">
                <basic-slider id="blockProbSlider" label="Slice Glitch Probability" min="0" max="1" value="1" unit=""></basic-slider>
            </div>
            <div class="control-item">
                <basic-slider id="maxBlockHeightSlider" label="Max Slice Height" min="1" max="300" value="0.83" unit=""></basic-slider>
            </div>
            <div class="control-item">
                <basic-slider id="displacementSlider" label="Max H-Displacement" min="0" max="100" value="0.5" unit=""></basic-slider>
            </div>
            
            <h4>Gap Settings</h4>
            <div class="control-item">
                <basic-slider id="sliceGapSlider" label="Slice Gap Size" min="-30" max="30" value="0.5" unit="px"></basic-slider>
            </div>
            <div class="control-item">
                <basic-slider id="gapVariabilitySlider" label="Slice Gap Variability" min="0" max="2" value="0" unit=""></basic-slider>
            </div>
            
            <h3>Vertical Lines</h3>
            <div class="control-item">
                <basic-slider id="lineProbSlider" label="Line Glitch Probability" min="0" max="1" value="0" unit=""></basic-slider>
            </div>
            <div class="control-item">
                <basic-slider id="maxLineWidthSlider" label="Max Line Width" min="1" max="300" value="0.0133" unit=""></basic-slider>
            </div>
            <div class="control-item">
                <basic-slider id="vDisplacementSlider" label="Max V-Displacement (Lines)" min="0" max="100" value="0" unit=""></basic-slider>
            </div>
            
            <h4>Gap Settings</h4>
            <div class="control-item">
                <basic-slider id="lineGapSlider" label="Line Gap Size" min="-30" max="30" value="0.5" unit="px"></basic-slider>
            </div>
            <div class="control-item">
                <basic-slider id="lineGapVariabilitySlider" label="Line Gap Variability" min="0" max="2" value="0" unit=""></basic-slider>
            </div>
            
            <h3>Scrolling Settings</h3>
            <div class="control-item toggle-item">
                <label for="freezeSlicesCheckbox" class="toggle-label">Freeze Slices</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="freezeSlicesCheckbox">
                    <span class="toggle-slider"></span>
                </div>
            </div>
            <div class="control-item">
                <basic-slider id="hScrollSpeedSlider1" label="Img 1 Horizontal Scroll" min="-100" max="100" value="0.5" unit="px/s"></basic-slider>
            </div>
            <div class="control-item">
                <basic-slider id="hScrollSpeedSlider2" label="Img 2 Horizontal Scroll" min="-100" max="100" value="0.5" unit="px/s"></basic-slider>
            </div>
            <div class="control-item">
                <basic-slider id="scrollSpeedSlider1" label="Img 1 Vertical Scroll" min="-100" max="100" value="0.5" unit="px/s"></basic-slider>
            </div>
            <div class="control-item">
                <basic-slider id="scrollSpeedSlider2" label="Img 2 Vertical Scroll" min="-100" max="100" value="0.5" unit="px/s"></basic-slider>
            </div>
            
            <h3>Recording</h3>
            <div class="control-item toggle-item">
                <label for="optimizedRecordingCheckbox" class="toggle-label">Optimized Recording (crop to image bounds)</label>
                <div class="toggle-switch">
                    <input type="checkbox" id="optimizedRecordingCheckbox" checked>
                    <span class="toggle-slider"></span>
                </div>
            </div>
            <div class="control-group">
                <label for="backgroundColorPicker">Export Background Color:</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="color" id="backgroundColorPicker" value="#00ff00" style="width: 40px; height: 30px; border: 1px solid var(--us-border-hard); border-radius: var(--us-radii-micro-small); cursor: pointer;">
                    <select id="backgroundPresets" style="flex: 1; padding: 5px; border: 1px solid var(--us-border-hard); border-radius: var(--us-radii-micro-small); background-color: var(--us-bg-mid); color: var(--us-fg-default);">
                        <option value="#00ff00">Green Screen</option>
                        <option value="#0000ff">Blue Screen</option>
                        <option value="#ff00ff">Magenta Screen</option>
                        <option value="transparent">Transparent</option>
                        <option value="#000000">Black</option>
                        <option value="#ffffff">White</option>
                    </select>
                </div>
                <span style="font-size: var(--us-font-size-label); color: var(--us-fg-subtext);">Choose background color for video export (for chroma keying)</span>
            </div>
             <div class="control-group"> <button id="startButton">Start Recording</button> <button id="stopButton" disabled>Stop & Download</button> <div id="recordingStatus"></div> </div>
             
             <!-- Randomize Button -->
             <div class="control-group">
                 <button id="randomizeButton" style="width: 100%; margin-top: 0.5rem; padding: 10px; background-color: var(--us-bg-accent); color: var(--us-fg-inverted); border: none; border-radius: var(--us-radii-micro-small); cursor: pointer; font-weight: bold;">🎲 Randomize Sliders</button>
             </div>
        </div>
        <div class="canvas-container"> <canvas id="glitchCanvas"></canvas> </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
