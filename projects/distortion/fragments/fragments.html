<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Distortion – Fragments Mode</title>
    <link rel="stylesheet" href="fragments.css" />
</head>
<body>
    <div class="container">
        <!-- Controls Panel -->
        <div id="controlsPanel" class="controls-panel">
            <h1>Fragments Mode</h1>
            <div class="controls-section">
                <!-- Image Upload -->
                <div class="major-section">
                    <h2 class="section-title">Image</h2>
                    <label for="imageLoader" class="file-upload-label">Upload Image</label>
                    <input type="file" id="imageLoader" name="imageLoader" accept="image/*" />
                </div>

                <div class="section-divider"></div>
                
                <!-- Distortion Parameters -->
                <div class="major-section">
                    <h2 class="section-title">Distortion Parameters</h2>
                    <div class="slider-container">
                        <label for="intensitySlider">Intensity <span class="value-display" id="intensityValue">30</span></label>
                        <!-- Adding "step" and "class" for better behavior -->
                        <input type="range" id="intensitySlider" min="0" max="300" value="30" step="1" class="slider" />
                    </div>

                    <div class="slider-container">
                        <label for="radiusSlider">Radius <span class="value-display" id="radiusValue">800</span></label>
                        <input type="range" id="radiusSlider" min="10" max="1500" value="800" step="1" class="slider" />
                    </div>

                    <div class="slider-container">
                        <label for="blockSizeSlider">Block Size <span class="value-display" id="blockSizeValue">50</span></label>
                        <input type="range" id="blockSizeSlider" min="2" max="300" value="50" step="1" class="slider" />
                    </div>

                    <div class="toggle-container">
                        <label class="toggle-label">
                            <input type="checkbox" id="animationToggle" checked>
                            Enable Animation
                        </label>
                    </div>
                </div>

                <div class="section-divider"></div>
                
                <!-- Interaction Mode -->
                <div class="major-section">
                    <h2 class="section-title">Interaction Mode</h2>
                    <div class="mode-tabs">
                        <button id="togglePersistentBtn" class="mode-tab">Persistent Points</button>
                        <button id="hoverModeBtn" class="mode-tab active">Hover Mode</button>
                    </div>
                    <div class="persistent-controls">
                        <div class="persistent-info">
                            <span id="pointCount">0</span> point(s) active
                        </div>
                        <button id="clearPointsBtn" class="control-btn secondary">Clear All Points</button>
                    </div>
                    <p class="mode-note">Click on the image to place persistent distortion points or hover to see live effects.</p>
                </div>

                <div class="section-divider"></div>
                
                <!-- Actions -->
                <div class="major-section">
                    <h2 class="section-title">Actions</h2>
                    <div class="action-buttons">
                        <button id="saveImageBtn" class="control-btn primary">Save Image</button>
                    </div>
                </div>
                
                <div class="section-divider"></div>
                
                <!-- Recording Controls -->
                <div class="major-section">
                    <h2 class="section-title">Record Animation</h2>
                    <div class="recording-controls">
                        <div class="duration-control">
                            <label for="recordingDurationInput">Duration</label>
                            <div class="input-with-unit">
                                <input type="number" id="recordingDurationInput" value="5" min="1" max="60">
                                <span class="unit">seconds</span>
                            </div>
                        </div>
                        <button id="startRecordingBtn" class="control-btn primary">Start Recording</button>
                        <div class="recording-status">
                            <span id="recordingStatus">Status: Idle</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-container">
            <canvas id="imageCanvas"></canvas>
        </div>
    </div>

    <script src="fragments.js"></script>
</body>
</html>
