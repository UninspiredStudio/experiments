<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Target</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="us-tokens.css"> <!-- Link local tokens -->
    <style>
        /* Basic styling */
        body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        canvas { display: block; background-color: var(--us-bg-canvas); border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); cursor: default; /* Default cursor */ }
        canvas.setting-targets { cursor: pointer; } /* Cursor indicates only targets are clickable/draggable in this mode */
        canvas.setting-targets.dragging-target { cursor: grabbing; } /* Cursor when actively dragging a target */

        /* Controls styling */
        .control-panel { width: 25%; min-width: 250px; max-width: 350px; padding: 1rem; background-color: white; box-shadow: 2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 100vh; }
        .controls-container { overflow-y: auto; flex-grow: 1; }
        .control-section { width: 100%; padding: 0 0.5rem; margin-bottom: 1rem; }
        .control-label { display: block; text-align: center; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.25rem; }
        .control-value { display: block; text-align: center; font-size: 0.875rem; color: #6b7280; margin-top: 0.25rem; }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; background: #d1d5db; outline: none; opacity: 0.7; transition: opacity .2s; border-radius: 9999px; margin-top: 0.25rem; margin-bottom: 0.25rem; }
        input[type="range"]:hover:not(:disabled) { opacity: 1; }
        input[type="range"]:disabled { opacity: 0.5; cursor: not-allowed; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #3b82f6; cursor: pointer; border-radius: 50%; }
        input[type="range"]:disabled::-webkit-slider-thumb { background: #9ca3af; cursor: not-allowed; }
        input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; background: #3b82f6; cursor: pointer; border-radius: 50%; border: none; }
        input[type="range"]:disabled::-moz-range-thumb { background: #9ca3af; cursor: not-allowed; }

        /* Buttons */
        .control-button { padding: 0.5rem 1rem; background-color: #3b82f6; color: white; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; font-weight: 500; transition: background-color 0.2s ease; margin-top: 0.5rem; width: 100%; }
        .control-button:hover:not(:disabled) { background-color: #2563eb; }
        .control-button:active:not(:disabled) { background-color: #1d4ed8; }
        .control-button:disabled { background-color: #9ca3af; cursor: not-allowed; opacity: 0.7; }
        #animate-button.animating { background-color: #ef4444; } /* Red when animating */
        #animate-button.animating:hover:not(:disabled) { background-color: #dc2626; }
        #set-target-button.setting-targets { background-color: #10b981; } /* Green when setting targets */
        #set-target-button.setting-targets:hover:not(:disabled) { background-color: #059669; }
        /* Style for upload button */
        #upload-button { background-color: #6b7280; } /* Gray */
        #upload-button:hover:not(:disabled) { background-color: #4b5563; }

        /* Image List Styling */
        #image-list-container { border-top: 1px solid #e5e7eb; margin-top: 1rem; padding-top: 1rem; flex-grow: 1; overflow-y: auto; min-height: 100px; }
        #image-list { list-style: none; padding: 0; margin: 0; }
        .image-list-item { display: flex; align-items: center; padding: 0.5rem; margin-bottom: 0.5rem; background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 0.375rem; user-select: none; }
        .image-list-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 0.25rem; margin-right: 0.75rem; flex-shrink: 0; pointer-events: none; }
        .image-list-item .info { flex-grow: 1; overflow: hidden; margin-right: 0.5rem; pointer-events: none; }
        .image-list-item .info span { display: block; font-size: 0.875rem; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .image-list-item .controls { display: flex; flex-direction: column; flex-shrink: 0; }
        .image-list-item button { background-color: #d1d5db; border: none; border-radius: 0.25rem; padding: 0.1rem 0.3rem; margin-bottom: 0.1rem; cursor: pointer; font-size: 0.75rem; line-height: 1; color: #374151; transition: background-color 0.2s ease; }
        .image-list-item button:hover:not(:disabled) { background-color: #9ca3af; }
        .image-list-item button:disabled { background-color: #e5e7eb; color: #9ca3af; cursor: not-allowed; }

        /* Canvas Area Styling */
        #canvas-area { flex-grow: 1; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; padding: 1rem; box-sizing: border-box; }
        #canvas-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #drop-overlay { position: absolute; top: 1rem; left: 1rem; right: 1rem; bottom: 1rem; background-color: rgba(0, 0, 0, 0.5); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; border-radius: 0.5rem; z-index: 10; }
        #drop-overlay.visible { opacity: 1; }

        /* Visually hide the actual file input */
        #upload-input { display: none; }

    </style>
</head>
<body class="flex flex-row h-screen">

    <div class="control-panel">
        <h2 class="text-lg font-semibold text-gray-800 mt-2 mb-4 text-center">Controls</h2>

        <div class="controls-container space-y-4">
             <div class="control-section text-center border-b pb-4 mb-4 border-gray-200">
                 <p class="text-gray-700 text-sm mb-2">Add images via drag & drop or upload:</p>
                 <input type="file" id="upload-input" accept="image/*" multiple>
                 <button id="upload-button" class="control-button">Upload Images</button>
             </div>

            <div class="control-section">
                <label for="offset-magnitude-control" class="control-label">Static Offset Magnitude:</label>
                <input type="range" id="offset-magnitude-control" min="0" max="500" step="5" value="100">
                <span id="offset-magnitude-value" class="control-value">100px</span>
            </div>

            <div class="control-section">
                <label for="size-control" class="control-label">Image Size:</label>
                <input type="range" id="size-control" min="0.1" max="2" step="0.05" value="0.1">
                <span id="size-value" class="control-value">Scale: 0.10</span> </div>

            <div class="control-section text-center space-y-2">
                 <button id="randomize-button" class="control-button">Randomize Animation Targets</button>
                 <button id="set-target-button" class="control-button">Set Targets Manually</button>
                 <button id="animate-button" class="control-button">Start Animation</button>
            </div>

            <div id="image-list-container" class="control-section">
                <h3 class="text-md font-semibold text-gray-700 mb-2 text-center">Image Order</h3>
                <ul id="image-list">
                    </ul>
            </div>
        </div>
    </div>

    <div id="canvas-area">
        <div id="canvas-container">
             <canvas id="imageCanvas"></canvas>
        </div>
         <div id="drop-overlay">Drop image here</div>
    </div>

    <script>
        // --- DOM References ---
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const offsetMagnitudeControl = document.getElementById('offset-magnitude-control');
        const offsetMagnitudeValueDisplay = document.getElementById('offset-magnitude-value');
        const sizeControl = document.getElementById('size-control');
        const sizeValueDisplay = document.getElementById('size-value');
        const randomizeButton = document.getElementById('randomize-button');
        const setTargetButton = document.getElementById('set-target-button');
        const animateButton = document.getElementById('animate-button');
        const imageList = document.getElementById('image-list');
        const canvasArea = document.getElementById('canvas-area');
        const canvasContainer = document.getElementById('canvas-container');
        const dropOverlay = document.getElementById('drop-overlay');
        const uploadInput = document.getElementById('upload-input');
        const uploadButton = document.getElementById('upload-button');

        // --- State Variables ---
        let images = [];
        let offsetMagnitude = parseFloat(offsetMagnitudeControl.value);
        // *** READ UPDATED DEFAULT VALUE FROM HTML ***
        let globalScale = parseFloat(sizeControl.value);
        let imageCounter = 0;
        let isAnimating = false;
        let animationFrameId = null;
        let isSettingTargets = false;
        let draggedImageData = null;
        let dragClickOffsetX = 0;
        let dragClickOffsetY = 0;

        // --- Canvas Setup ---
        function resizeCanvas() { /* ... remains same ... */
            const containerStyle = window.getComputedStyle(canvasArea);
            const paddingX = parseFloat(containerStyle.paddingLeft) + parseFloat(containerStyle.paddingRight);
            const paddingY = parseFloat(containerStyle.paddingTop) + parseFloat(containerStyle.paddingBottom);
            const availableWidth = canvasArea.clientWidth - paddingX; const availableHeight = canvasArea.clientHeight - paddingY;
            canvas.width = availableWidth; canvas.height = availableHeight;
            dropOverlay.style.width = `${canvas.width}px`; dropOverlay.style.height = `${canvas.height}px`;
            dropOverlay.style.left = `0px`; dropOverlay.style.top = `0px`;
            drawBasedOnMode();
        }

        // --- Drawing Logic ---
        function targetIsSet(imgData) { /* ... remains same ... */
            const dx = imgData.targetOffsetX - imgData.initialOffsetX; const dy = imgData.targetOffsetY - imgData.initialOffsetY;
            return (dx * dx + dy * dy) > 1;
        }
        function drawSingleImageRepresentation(imgData, offsetX, offsetY, opacity = 1, isTargetRep = false, isBeingDragged = false) { /* ... remains same ... */
            if (!imgData.img.complete || imgData.img.naturalWidth === 0) return;
            const centerX = canvas.width / 2; const centerY = canvas.height / 2;
            const scaledWidth = imgData.img.naturalWidth * globalScale; const scaledHeight = imgData.img.naturalHeight * globalScale;
            const drawX = centerX + offsetX - scaledWidth / 2; const drawY = centerY + offsetY - scaledHeight / 2;
            ctx.save(); ctx.globalAlpha = opacity;
            if (isTargetRep) {
                ctx.strokeStyle = '#10b981'; ctx.lineWidth = isBeingDragged ? 3 : 2;
                if (!isBeingDragged) { ctx.setLineDash([5, 3]); }
                ctx.strokeRect(drawX - ctx.lineWidth/2, drawY - ctx.lineWidth/2, scaledWidth + ctx.lineWidth, scaledHeight + ctx.lineWidth);
            }
            if (isBeingDragged) { ctx.globalAlpha = Math.min(opacity, 0.8); }
            ctx.drawImage(imgData.img, drawX, drawY, scaledWidth, scaledHeight); ctx.restore();
        }
        function drawBasedOnMode() { /* ... remains same ... */
             ctx.clearRect(0, 0, canvas.width, canvas.height);
             images.forEach(imgData => {
                 const isBeingDragged = (draggedImageData === imgData);
                 if (isAnimating) { drawSingleImageRepresentation(imgData, imgData.currentOffsetX, imgData.currentOffsetY); }
                 else if (isSettingTargets) {
                     drawSingleImageRepresentation(imgData, imgData.initialOffsetX, imgData.initialOffsetY, 0.4); // Static transparent
                     let targetDrawX = imgData.targetOffsetX; let targetDrawY = imgData.targetOffsetY;
                     if (isBeingDragged) { targetDrawX = imgData.currentOffsetX; targetDrawY = imgData.currentOffsetY; }
                     if (targetIsSet(imgData) || isBeingDragged) { drawSingleImageRepresentation(imgData, targetDrawX, targetDrawY, 0.95, true, isBeingDragged); } // Target opaque
                 } else { drawSingleImageRepresentation(imgData, imgData.initialOffsetX, imgData.initialOffsetY); } // Default static
             });
        }

        // --- Animation Loop ---
        function animateLoop() { /* ... remains same ... */
            if (!isAnimating) { if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; } return; }
            ctx.clearRect(0, 0, canvas.width, canvas.height); let animationStillActive = false;
            images.forEach(imgData => {
                const dx = imgData.targetOffsetX - imgData.currentOffsetX; const dy = imgData.targetOffsetY - imgData.currentOffsetY; const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance > 0.5) { imgData.currentOffsetX += dx * 0.05; imgData.currentOffsetY += dy * 0.05; animationStillActive = true; }
                else { imgData.currentOffsetX = imgData.targetOffsetX; imgData.currentOffsetY = imgData.targetOffsetY; }
                drawSingleImageRepresentation(imgData, imgData.currentOffsetX, imgData.currentOffsetY);
            });
            if (animationStillActive) { animationFrameId = requestAnimationFrame(animateLoop); }
            else { stopAnimation(); console.log("Animation finished."); }
        }

        // --- Start/Stop Animation ---
        function toggleAnimation() { /* ... remains same ... */
            if (isSettingTargets) return; if (isAnimating) { stopAnimation(); return; }
            let needsAnimation = images.some(imgData => targetIsSet(imgData));
            if (needsAnimation) {
                isAnimating = true; updateUIDisabledStates();
                images.forEach(imgData => { imgData.currentOffsetX = imgData.initialOffsetX; imgData.currentOffsetY = imgData.initialOffsetY; });
                console.log("Starting animation towards set targets.");
                if (animationFrameId === null) { animationFrameId = requestAnimationFrame(animateLoop); }
            } else { console.log("No animation needed - targets match static positions."); }
        }
        function stopAnimation() { /* ... remains same ... */
             if (isAnimating) {
                 isAnimating = false;
                 images.forEach(imgData => { imgData.currentOffsetX = imgData.targetOffsetX; imgData.currentOffsetY = imgData.targetOffsetY; });
                 updateUIDisabledStates();
                 if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
                 drawBasedOnMode();
             }
        }

        // --- Start/Stop Target Setting Mode ---
        function toggleTargetSetting() { /* ... remains same ... */
            if (isAnimating) return; isSettingTargets = !isSettingTargets;
             images.forEach(img => { img.currentOffsetX = img.initialOffsetX; img.currentOffsetY = img.initialOffsetY; });
            updateUIDisabledStates(); canvas.classList.toggle('setting-targets', isSettingTargets); drawBasedOnMode();
        }

        // --- Update UI Disabled States (Consolidated) ---
        function updateUIDisabledStates() { /* ... remains same ... */
             const shouldDisableControls = isAnimating || isSettingTargets;
             animateButton.textContent = isAnimating ? 'Stop Animation' : 'Start Animation'; animateButton.classList.toggle('animating', isAnimating);
             setTargetButton.textContent = isSettingTargets ? 'Finish Setting Targets' : 'Set Targets Manually'; setTargetButton.classList.toggle('setting-targets', isSettingTargets);
             offsetMagnitudeControl.disabled = shouldDisableControls; sizeControl.disabled = shouldDisableControls;
             randomizeButton.disabled = shouldDisableControls; uploadButton.disabled = shouldDisableControls;
             animateButton.disabled = isSettingTargets; setTargetButton.disabled = isAnimating;
             imageList.querySelectorAll('.image-list-item button').forEach(btn => { btn.disabled = shouldDisableControls; });
             if (!shouldDisableControls) { updateButtonStates(); }
        }

        // --- Update Static Offsets (Slider) ---
        function updateStaticOffsets() { /* ... remains same ... */
             stopAnimation(); if (isSettingTargets) toggleTargetSetting();
             images.forEach(imgData => {
                 imgData.initialOffsetX = Math.cos(imgData.randomAngle) * offsetMagnitude; imgData.initialOffsetY = Math.sin(imgData.randomAngle) * offsetMagnitude;
                 imgData.currentOffsetX = imgData.initialOffsetX; imgData.currentOffsetY = imgData.initialOffsetY;
                 imgData.targetOffsetX = imgData.initialOffsetX; imgData.targetOffsetY = imgData.initialOffsetY;
             });
             drawBasedOnMode();
        }
        // --- Randomize Animation Targets ---
        function randomizeAnimationTargets() { /* ... remains same ... */
            stopAnimation(); if (isSettingTargets) toggleTargetSetting();
            console.log("Randomizing animation targets.");
            const maxTargetOffsetX = canvas.width / 2 * 0.85; const maxTargetOffsetY = canvas.height / 2 * 0.85;
            images.forEach(imgData => {
                imgData.targetOffsetX = (Math.random() - 0.5) * 2 * maxTargetOffsetX; imgData.targetOffsetY = (Math.random() - 0.5) * 2 * maxTargetOffsetY;
            });
            console.log("New random targets set. Press 'Start Animation'.");
             if (isSettingTargets) { drawBasedOnMode(); }
        }

        // --- Image List Management ---
        function addImageToList(imgData, file) { /* ... remains same ... */
            const listItem = document.createElement('li'); listItem.className = 'image-list-item'; listItem.dataset.imageId = imgData.id;
            const imgElement = document.createElement('img'); imgElement.src = imgData.img.src; imgElement.alt = file.name;
            const infoDiv = document.createElement('div'); infoDiv.className = 'info';
            const nameSpan = document.createElement('span'); nameSpan.textContent = file.name; infoDiv.appendChild(nameSpan);
            const controlsDiv = document.createElement('div'); controlsDiv.className = 'controls';
            const upButton = document.createElement('button'); upButton.innerHTML = '&#x25B2;'; upButton.title = 'Move Up'; upButton.addEventListener('click', () => moveItemUp(listItem));
            const downButton = document.createElement('button'); downButton.innerHTML = '&#x25BC;'; downButton.title = 'Move Down'; downButton.addEventListener('click', () => moveItemDown(listItem));
            controlsDiv.appendChild(upButton); controlsDiv.appendChild(downButton);
            listItem.appendChild(imgElement); listItem.appendChild(infoDiv); listItem.appendChild(controlsDiv);
            imageList.appendChild(listItem);
            imgData.element = listItem;
            updateButtonStates();
        }
        function updateButtonStates() { /* ... remains same ... */
            const listItems = imageList.querySelectorAll('.image-list-item');
            const controlsDisabled = isAnimating || isSettingTargets;
            listItems.forEach((item, index) => {
                const upButton = item.querySelector('button:nth-of-type(1)');
                const downButton = item.querySelector('button:nth-of-type(2)');
                if (upButton) upButton.disabled = controlsDisabled || (index === 0);
                if (downButton) downButton.disabled = controlsDisabled || (index === listItems.length - 1);
            });
        }

        // --- Reordering Logic ---
        function moveItemUp(listItem) { /* ... remains same ... */
            stopAnimation(); if (isSettingTargets) toggleTargetSetting();
            const currentId = parseInt(listItem.dataset.imageId); const currentIndex = images.findIndex(img => img.id === currentId);
            if (currentIndex > 0) {
                const previousItem = listItem.previousElementSibling;
                [images[currentIndex], images[currentIndex - 1]] = [images[currentIndex - 1], images[currentIndex]];
                imageList.insertBefore(listItem, previousItem);
                updateButtonStates(); drawBasedOnMode();
            }
        }
        function moveItemDown(listItem) { /* ... remains same ... */
            stopAnimation(); if (isSettingTargets) toggleTargetSetting();
            const currentId = parseInt(listItem.dataset.imageId); const currentIndex = images.findIndex(img => img.id === currentId);
            if (currentIndex < images.length - 1) {
                const nextItem = listItem.nextElementSibling;
                [images[currentIndex], images[currentIndex + 1]] = [images[currentIndex + 1], images[currentIndex]];
                imageList.insertBefore(nextItem, listItem);
                updateButtonStates(); drawBasedOnMode();
            }
        }

        // --- Image File Processing (Refactored) ---
        function processImageFile(file) { /* ... remains same ... */
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = () => {
                        const imgId = imageCounter++; const randomAngle = Math.random() * 2 * Math.PI;
                        const initialOffsetX = Math.cos(randomAngle) * offsetMagnitude; const initialOffsetY = Math.sin(randomAngle) * offsetMagnitude;
                        const imgData = { id: imgId, img, randomAngle, initialOffsetX, initialOffsetY, currentOffsetX: initialOffsetX, currentOffsetY: initialOffsetY, targetOffsetX: initialOffsetX, targetOffsetY: initialOffsetY, element: null };
                        images.push(imgData); addImageToList(imgData, file); drawBasedOnMode();
                    };
                    img.onerror = () => console.error("Error loading image:", file.name); img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            } else { console.warn("Skipped non-image file:", file.name); }
        }

        // --- Drag and Drop for Image Upload ---
        function handleDragOverCanvas(event) { /* ... remains same ... */
             event.preventDefault(); event.dataTransfer.dropEffect = 'copy';
             if (canvasArea.contains(event.target)) { dropOverlay.classList.add('visible'); } else { dropOverlay.classList.remove('visible'); }
        }
        function handleDragLeaveCanvas(event) { /* ... remains same ... */
             if (!canvasArea.contains(event.relatedTarget)) { dropOverlay.classList.remove('visible'); }
        }
        function handleDropCanvas(event) { /* ... remains same ... */
            event.preventDefault(); dropOverlay.classList.remove('visible');
            if (!canvasArea.contains(event.target) && event.target !== canvasArea && !canvasContainer.contains(event.target) && event.target !== canvasContainer && event.target !== canvas) { return; }
            const files = event.dataTransfer.files;
            for (const file of files) { processImageFile(file); }
        }

        // --- Upload Button Handling ---
        function handleUploadButtonClick() { /* ... remains same ... */
            uploadInput.click();
        }
        function handleUploadInputChange(event) { /* ... remains same ... */
            const files = event.target.files;
            for (const file of files) { processImageFile(file); }
            event.target.value = null;
        }

        // --- Canvas Mouse Events for Target Setting ---
        function checkHit(mouseX, mouseY, imgData, offsetX, offsetY) { /* ... remains same ... */
             if (!imgData.img.complete || imgData.img.naturalWidth === 0) return false;
             const centerX = canvas.width / 2; const centerY = canvas.height / 2;
             const scaledWidth = imgData.img.naturalWidth * globalScale; const scaledHeight = imgData.img.naturalHeight * globalScale;
             const imgDrawX = centerX + offsetX - scaledWidth / 2; const imgDrawY = centerY + offsetY - scaledHeight / 2;
             return (mouseX >= imgDrawX && mouseX <= imgDrawX + scaledWidth && mouseY >= imgDrawY && mouseY <= imgDrawY + scaledHeight);
        }
        function handleCanvasMouseDown(event) { /* ... remains same ... */
            if (event.target !== canvas || !isSettingTargets || isAnimating) return;
            const mouseX = event.offsetX; const mouseY = event.offsetY; const centerX = canvas.width / 2; const centerY = canvas.height / 2;
            let foundImage = null;
            for (let i = images.length - 1; i >= 0; i--) {
                 const imgData = images[i];
                 if (targetIsSet(imgData) && checkHit(mouseX, mouseY, imgData, imgData.targetOffsetX, imgData.targetOffsetY)) {
                     foundImage = imgData;
                     const targetCenterX = centerX + imgData.targetOffsetX; const targetCenterY = centerY + imgData.targetOffsetY;
                     dragClickOffsetX = mouseX - targetCenterX; dragClickOffsetY = mouseY - targetCenterY; break;
                 }
            }
             if (!foundImage) {
                  for (let i = images.length - 1; i >= 0; i--) {
                     const imgData = images[i];
                     if (!targetIsSet(imgData) && checkHit(mouseX, mouseY, imgData, imgData.initialOffsetX, imgData.initialOffsetY)) {
                         foundImage = imgData;
                         const initialCenterX = centerX + imgData.initialOffsetX; const initialCenterY = centerY + imgData.initialOffsetY;
                         dragClickOffsetX = mouseX - initialCenterX; dragClickOffsetY = mouseY - initialCenterY;
                         imgData.targetOffsetX = imgData.initialOffsetX; imgData.targetOffsetY = imgData.initialOffsetY; imgData.currentOffsetX = imgData.initialOffsetX; imgData.currentOffsetY = imgData.initialOffsetY;
                         break;
                     }
                 }
             }
            if (foundImage) {
                draggedImageData = foundImage; canvas.classList.add('dragging-target');
                window.addEventListener('mousemove', handleCanvasMouseMove); window.addEventListener('mouseup', handleCanvasMouseUp, { once: true });
                drawBasedOnMode();
            }
        }
        function handleCanvasMouseMove(event) { /* ... remains same ... */
            if (!isSettingTargets || !draggedImageData) return; event.preventDefault();
            const rect = canvas.getBoundingClientRect(); const mouseX = event.clientX - rect.left; const mouseY = event.clientY - rect.top;
            const centerX = canvas.width / 2; const centerY = canvas.height / 2;
            const newImageCenterX = mouseX - dragClickOffsetX; const newImageCenterY = mouseY - dragClickOffsetY;
            const newOffsetX = newImageCenterX - centerX; const newOffsetY = newImageCenterY - centerY;
            draggedImageData.targetOffsetX = newOffsetX; draggedImageData.targetOffsetY = newOffsetY;
            draggedImageData.currentOffsetX = newOffsetX; draggedImageData.currentOffsetY = newOffsetY;
            drawBasedOnMode();
        }
        function handleCanvasMouseUp(event) { /* ... remains same ... */
             if (!draggedImageData) return;
             canvas.classList.remove('dragging-target'); window.removeEventListener('mousemove', handleCanvasMouseMove);
             draggedImageData.currentOffsetX = draggedImageData.initialOffsetX; draggedImageData.currentOffsetY = draggedImageData.initialOffsetY;
             console.log(`Final target for Image ${draggedImageData.id} set to Offset: (${draggedImageData.targetOffsetX.toFixed(1)}, ${draggedImageData.targetOffsetY.toFixed(1)})`);
             const previouslyDragged = draggedImageData; draggedImageData = null;
             drawBasedOnMode();
        }

        // --- Control Event Handlers ---
        offsetMagnitudeControl.addEventListener('input', (event) => { /* ... remains same ... */
            offsetMagnitude = parseFloat(event.target.value); offsetMagnitudeValueDisplay.textContent = `${offsetMagnitude.toFixed(0)}px`; updateStaticOffsets();
        });
        sizeControl.addEventListener('input', (event) => { /* ... remains same ... */
            globalScale = parseFloat(event.target.value); sizeValueDisplay.textContent = `Scale: ${globalScale.toFixed(2)}`; drawBasedOnMode();
        });
        randomizeButton.addEventListener('click', randomizeAnimationTargets);
        setTargetButton.addEventListener('click', toggleTargetSetting);
        animateButton.addEventListener('click', toggleAnimation);
        uploadButton.addEventListener('click', handleUploadButtonClick);
        uploadInput.addEventListener('change', handleUploadInputChange);

        // --- Initialization ---
        function initialize() {
            offsetMagnitudeValueDisplay.textContent = `${offsetMagnitude.toFixed(0)}px`;
            // *** UPDATE INITIAL DISPLAY FOR SIZE SLIDER ***
            sizeValueDisplay.textContent = `Scale: ${globalScale.toFixed(2)}`;
            // Event listeners
            window.addEventListener('dragover', handleDragOverCanvas);
            canvasArea.addEventListener('dragleave', handleDragLeaveCanvas);
            window.addEventListener('drop', handleDropCanvas);
            canvas.addEventListener('mousedown', handleCanvasMouseDown);
            window.addEventListener('resize', resizeCanvas);
            // Initial setup
            resizeCanvas();
            updateUIDisabledStates();
        }

        document.addEventListener('DOMContentLoaded', initialize);

    </script>

</body>
</html>
