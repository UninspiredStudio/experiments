<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ungrid by Uninspired Studio</title>

    <script type="module" src="https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/dist/esm/simplex-noise.js"></script>
    <link rel="stylesheet" href="style.css">

    <!-- UNINSPIRED STUFF -->
    <script defer data-domain="experiments.uninspired.studio" src="https://analytics.uninspired.studio/js/script.js"></script>
    <link rel="stylesheet" href="uninspired/tokens.css">
    <script src="uninspired/components/basic-slider.js"></script>

</head>
<body>

    <div id="main-layout">
        <div id="controls-container">
            <div id="controls">
                <!-- 1. Background -->
                <div class="control-group-label typo-body-bold">Background</div>
                <div class="control-item file-upload-item full-width">
                    <label id="bgUploadLabel" for="bgUpload" class="button-label typo-label">Upload Background</label>
                    <input type="file" id="bgUpload" accept="image/*">
                </div>
                <div id="bgPreviewContainer" class="preview-container" style="display: none;">
                    <div class="preview-item">
                        <img id="bgPreviewImage" class="preview-image" alt="Background preview">
                        <button id="bgDeleteButton" class="delete-button" title="Delete background image">×</button>
                    </div>
                </div>

                <hr>

                <!-- 2. Cell -->
                <div class="control-group-label typo-body-bold">Cell Images</div>
                <div class="control-item file-upload-item full-width">
                    <label id="cellImgUploadLabel" for="cellImgUpload" class="button-label typo-label">Add Cell Images</label>
                    <input type="file" id="cellImgUpload" accept="image/*" multiple>
                </div>
                <div id="cellPreviewContainer" class="preview-container preview-grid" style="display: none;"></div>

                <hr>

                <!-- 3. Typo Cell -->
                <div class="control-group-label typo-body-bold">Letter Cells</div>
                <div class="control-item">
                     <label for="letterInput" class="typo-label-bold" style="margin-bottom: 0.5rem;">Letters for Cells:</label>
                     <input type="text" id="letterInput" placeholder="Type letters here (optional)">
                     <span class="typo-label" style="color: var(--us-fg-subtext); display: block; width: 100%; text-align: left; margin-top: 0.1rem;">If letters are provided, some active cells may display a letter instead of an image.</span>
                </div>
                <div class="control-item letter-controls-container">
                     <div class="letter-color-group">
                         <label for="letterColorInput" class="color-label typo-label">Letter Color</label>
                         <input type="color" id="letterColorInput" value="#FFFFFF">
                     </div>
                     <div class="letter-color-group">
                         <label for="letterBgColorInput" class="color-label typo-label">Letter Cell BG</label>
                         <input type="color" id="letterBgColorInput" value="#000000">
                     </div>
                </div>

                <hr>

                <!-- 4. Layout -->
                <div class="control-group-label typo-body-bold">Layout</div>
                <!-- 4.1 Simplify Pattern - Segmented Tab -->
                <div class="control-item">
                     <label class="typo-label-bold" style="margin-bottom: 0.5rem;">Simplify Pattern:</label>
                     <div class="segmented-control" id="simplifyPatternControl">
                         <input type="radio" id="simplifyComplex" name="simplifyPattern" value="complex" checked>
                         <label for="simplifyComplex" class="segment-label typo-label">Complex</label>
                         <input type="radio" id="simplifySimple" name="simplifyPattern" value="simple">
                         <label for="simplifySimple" class="segment-label typo-label">Simplify</label>
                     </div>
                </div>
                <!-- 4.2 Animation on - Segmented Tab -->
                 <div class="control-item">
                   <label class="typo-label-bold" style="margin-bottom: 0.5rem;">Animate On:</label>
                   <div class="segmented-control" id="animateOnControl">
                       <input type="radio" id="animEverywhere" name="animArea" value="everywhere">
                       <label for="animEverywhere" class="segment-label typo-label">Everywhere</label>
                       <input type="radio" id="animLight" name="animArea" value="light">
                       <label for="animLight" class="segment-label typo-label">Light Areas</label>
                       <input type="radio" id="animDark" name="animArea" value="dark" checked>
                       <label for="animDark" class="segment-label typo-label">Dark Areas</label>
                   </div>
                </div>
                <div class="control-item">
                    <basic-slider id="brightnessThresholdControl" label="Light/Dark Threshold" min="0" max="255" value="0.5020" unit=""></basic-slider>
                </div>
                <!-- 4.3 Sliders -->
                 <div class="control-item">
                    <basic-slider id="speedControl" label="Speed" min="1" max="20" value="0.2105" unit=""></basic-slider>
                </div>
                <div class="control-item">
                     <basic-slider id="gridAmountControl" label="Grid Amount" min="10" max="200" value="0.1053" unit=""></basic-slider>
                </div>
                <div class="control-item">
                    <basic-slider id="fillControl" label="Max Fill" min="0" max="100" value="0.5" unit="%"></basic-slider>
                </div>

                <hr>

                <!-- 5. Timed Sequence & Recording -->
                <div class="control-group-label typo-body-bold">Timed Sequence & Recording</div>
                <!-- Overall Length - Segmented Tab -->
                <div class="control-item">
                         <label class="typo-label-bold" style="margin-bottom: 0.5rem;">Overall Length:</label>
                         <div class="segmented-control" id="overallLengthControl">
                             <input type="radio" id="length5s" name="overallLength" value="5" checked>
                             <label for="length5s" class="segment-label typo-label">5s</label>
                             <input type="radio" id="length10s" name="overallLength" value="10">
                             <label for="length10s" class="segment-label typo-label">10s</label>
                             <input type="radio" id="length20s" name="overallLength" value="20">
                             <label for="length20s" class="segment-label typo-label">20s</label>
                             <input type="radio" id="length30s" name="overallLength" value="30">
                             <label for="length30s" class="segment-label typo-label">30s</label>
                         </div>
                    </div>
                    
                <!-- Fade In Group -->
                <div class="fade-control-group">
                    <!-- Fade In Toggle and Segmented Tab -->
                    <div class="control-item toggle-item">
                         <label for="startAnimationToggle" class="toggle-label typo-label">Enable Start Fade-In</label>
                         <div class="toggle-switch">
                             <input type="checkbox" id="startAnimationToggle">
                             <span class="toggle-slider"></span>
                         </div>
                    </div>
                    <div class="control-item">
                         <label class="typo-label-bold" style="margin-bottom: 0.5rem;">Fade In:</label>
                         <div class="segmented-control" id="fadeInControl">
                             <input type="radio" id="fadeIn025" name="fadeIn" value="0.25">
                             <label for="fadeIn025" class="segment-label typo-label">0.25s</label>
                             <input type="radio" id="fadeIn05" name="fadeIn" value="0.5">
                             <label for="fadeIn05" class="segment-label typo-label">0.5s</label>
                             <input type="radio" id="fadeIn1" name="fadeIn" value="1" checked>
                             <label for="fadeIn1" class="segment-label typo-label">1s</label>
                             <input type="radio" id="fadeIn2" name="fadeIn" value="2">
                             <label for="fadeIn2" class="segment-label typo-label">2s</label>
                             <input type="radio" id="fadeIn5" name="fadeIn" value="5">
                             <label for="fadeIn5" class="segment-label typo-label">5s</label>
                         </div>
                    </div>
                </div>
                    
                <!-- Fade Out Group -->
                <div class="fade-control-group">
                    <!-- Fade Out Toggle and Segmented Tab -->
                    <div class="control-item toggle-item">
                         <label for="endAnimationToggle" class="toggle-label typo-label">Enable End Fade-Out</label>
                         <div class="toggle-switch">
                             <input type="checkbox" id="endAnimationToggle">
                             <span class="toggle-slider"></span>
                         </div>
                    </div>
                    <div class="control-item">
                         <label class="typo-label-bold" style="margin-bottom: 0.5rem;">Fade Out:</label>
                         <div class="segmented-control" id="fadeOutControl">
                             <input type="radio" id="fadeOut025" name="fadeOut" value="0.25">
                             <label for="fadeOut025" class="segment-label typo-label">0.25s</label>
                             <input type="radio" id="fadeOut05" name="fadeOut" value="0.5">
                             <label for="fadeOut05" class="segment-label typo-label">0.5s</label>
                             <input type="radio" id="fadeOut1" name="fadeOut" value="1">
                             <label for="fadeOut1" class="segment-label typo-label">1s</label>
                             <input type="radio" id="fadeOut2" name="fadeOut" value="2" checked>
                             <label for="fadeOut2" class="segment-label typo-label">2s</label>
                             <input type="radio" id="fadeOut5" name="fadeOut" value="5">
                             <label for="fadeOut5" class="segment-label typo-label">5s</label>
                         </div>
                    </div>
                </div>
                    
                <!-- Action Buttons -->
                <div class="control-item action-buttons-container">
                     <button id="startButton" class="action-button typo-label-bold">Record</button>
                     <button id="restartButton" class="action-button typo-label-bold">Restart Animation</button>
                </div>

                <!-- Randomize Button -->
                <div class="control-item">
                    <button id="randomizeButton" class="action-button typo-label-bold" style="width: 100%; margin-top: 0.5rem;">🎲 Randomize Sliders</button>
                </div>

                <hr>

                <!-- 6. Manual Recording -->
                 <div class="control-group-label typo-body-bold">Manual Recording</div>
                 <div class="control-item manual-recording-controls">
                     <button id="startRecordButton" class="manual-record-button typo-label-bold">Manual Recording</button>
                     <button id="stopRecordButton" class="manual-record-button typo-label-bold" disabled>Stop Recording</button>
                 </div>
            </div>
        </div>

        <div id="canvas-container">
            <div id="loading" class="typo-heading-3">Loading...</div>
            <canvas id="noiseCanvas"></canvas>
            <canvas id="hiddenBgCanvas" style="display: none;"></canvas>
        </div>
    </div>

    <script type="module" src="main.js"></script>

</body>
</html>
