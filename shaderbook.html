<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Data Stream</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background-color: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
        #controls label { display: block; margin-bottom: 5px;}
        #controls input[type="text"] { width: 200px; margin-bottom: 10px; }
        #controls button { padding: 5px 10px; }
        #loading {
             position: absolute;
             top: 50%;
             left: 50%;
             transform: translate(-50%, -50%);
             color: white;
             font-size: 2em;
             font-family: sans-serif;
             display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <canvas id="dataStreamCanvas"></canvas>
    <div id="loading">Loading Images...</div>
    <div id="controls">
        <label for="imageUrls">Image URLs (comma-separated):</label>
        <input type="text" id="imageUrls" value="https://placehold.co/50x50/FF0000/FFFFFF?text=A, https://placehold.co/50x50/00FF00/FFFFFF?text=B, https://placehold.co/50x50/0000FF/FFFFFF?text=C, https://placehold.co/50x50/FFFF00/000000?text=D">
        <button id="updateImages">Update Images</button>
         <p>Mouse X affects threshold</p>
    </div>

    <script>
        // --- Configuration ---
        const GRID_X = 80; // Number of cells horizontally
        const GRID_Y = 40; // Number of cells vertically
        const BASE_SPEED = 2.0; // Base speed multiplier for movement

        // --- Canvas Setup ---
        const canvas = document.getElementById('dataStreamCanvas');
        const ctx = canvas.getContext('2d');
        const controls = document.getElementById('controls');
        const imageUrlsInput = document.getElementById('imageUrls');
        const updateButton = document.getElementById('updateImages');
        const loadingIndicator = document.getElementById('loading');

        // --- State Variables ---
        let u_time = 0;
        let u_resolution = { x: window.innerWidth, y: window.innerHeight };
        let u_mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 }; // Start mouse in center
        let cellWidth = u_resolution.x / GRID_X;
        let cellHeight = u_resolution.y / GRID_Y;
        let images = [];
        let imagesLoaded = false;
        let animationFrameId = null; // To store the requestAnimationFrame ID

        // --- GLSL Math Helpers (JavaScript versions) ---
        function fract(x) {
            return x - Math.floor(x);
        }

        function sin(x) {
            return Math.sin(x);
        }

        function dot(v1, v2) {
            // Check if inputs are numbers (for 1D random) or objects (for 2D random)
            if (typeof v1 === 'number' && typeof v2 === 'number') {
                 return v1 * v2; // Or handle 1D case as needed
            }
             if (typeof v1 === 'object' && typeof v2 === 'object' && v1 !== null && v2 !== null) {
                return (v1.x * v2.x) + (v1.y * v2.y);
            }
             // Default or error case
             return 0;
        }


        function floor(x) {
            // Check if input is a number or object
            if (typeof x === 'number') {
                return Math.floor(x);
            }
            if (typeof x === 'object' && x !== null) {
                return { x: Math.floor(x.x), y: Math.floor(x.y) };
            }
            // Default or error case
             return { x: 0, y: 0};
        }

        function step(edge, x) {
            return x < edge ? 0.0 : 1.0;
        }

        // Pseudo-random function (like GLSL) - 1D
        function random1D(x) {
            return fract(sin(x) * 10000.0); // Adjusted multiplier
        }

        // Pseudo-random function (like GLSL) - 2D
        function random2D(st) {
             // Ensure st is an object with x and y
             if (typeof st !== 'object' || st === null || typeof st.x !== 'number' || typeof st.y !== 'number') {
                console.warn("Invalid input for random2D:", st);
                st = { x: 0, y: 0 }; // Provide a default
            }
            const vec = { x: 12.9898, y: 78.233 };
            return fract(sin(dot(st, vec)) * 43758.5453123);
        }

        // --- Core Pattern Logic (Adapted from GLSL) ---
        // Determines if a cell should display an image
        function pattern(st, vel, t) {
            // st: current cell coordinate {x, y} (integer grid indices)
            // vel: velocity vector {x, y}
            // t: threshold
            const future_st = { x: st.x + vel.x, y: st.y + vel.y };
            const p = floor(future_st); // Integer part of the future position

            // Combine randomness based on future position 'p'
            // This approximates the GLSL logic: random(100.+p*.000001)+random(p.x)*0.5
             // Ensure p.x and p.y are numbers before using them
            const p_x = typeof p.x === 'number' ? p.x : 0;
            const p_y = typeof p.y === 'number' ? p.y : 0;

            // Use a combination of 1D and 2D random functions based on p
            // The exact GLSL combination is hard to replicate perfectly, this is an approximation
            const randVal = random2D({ x: 100.0 + p_x * 0.0001, y: 100.0 + p_y * 0.0001 }) + random1D(p_x) * 0.5;

            return step(t, fract(randVal)); // Use fract to keep value 0-1 before step
        }

        // --- Image Loading ---
        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = (err) => {
                    console.error("Failed to load image:", url, err);
                    // Resolve with a placeholder or null to avoid breaking Promise.all
                    // Using a simple placeholder object here
                    resolve({ url: url, error: true, width: cellWidth, height: cellHeight });
                   // reject(err); // Option: reject if any image fails
                };
                img.src = url;
            });
        }

        async function loadImages(urls) {
            imagesLoaded = false;
            loadingIndicator.style.display = 'block'; // Show loading
            controls.style.display = 'none'; // Hide controls during load
            console.log("Loading images:", urls);
            try {
                const results = await Promise.all(urls.map(loadImage));
                images = results.filter(img => !(img.error)); // Filter out errors
                console.log("Images loaded:", images.length);
                if (images.length === 0) {
                     console.error("No images loaded successfully. Using fallback.");
                     // Add a default placeholder if everything failed
                     images = [await loadImage(`https://placehold.co/${Math.round(cellWidth)}x${Math.round(cellHeight)}/CCCCCC/000000?text=Error`)];
                }
                imagesLoaded = true;
            } catch (error) {
                console.error("Error loading images:", error);
                images = []; // Clear images on major error
                // Optionally load a single fallback image here
                 images = [await loadImage(`https://placehold.co/${Math.round(cellWidth)}x${Math.round(cellHeight)}/FF0000/FFFFFF?text=FAIL`)];
                 imagesLoaded = true; // Allow animation to start with fallback
            } finally {
                 loadingIndicator.style.display = 'none'; // Hide loading
                 controls.style.display = 'block'; // Show controls
            }
        }

        // --- Animation Loop ---
        function animate(timestamp) {
            // Calculate time delta for smoother animation (optional but good practice)
            // const deltaTime = timestamp - (lastTimestamp || timestamp);
            // lastTimestamp = timestamp;
             // u_time += deltaTime * 0.001; // Increment time in seconds

             u_time += 0.016; // Simple time increment, assuming ~60fps

            // Clear canvas
            ctx.fillStyle = 'black'; // Background color
            ctx.fillRect(0, 0, u_resolution.x, u_resolution.y);

            if (!imagesLoaded || images.length === 0) {
                 // If images aren't ready, wait for the next frame
                 animationFrameId = requestAnimationFrame(animate);
                 return;
            }

            // Calculate threshold based on mouse position (normalized)
            const threshold = Math.max(0.01, Math.min(0.99, 0.1 + (u_mouse.x / u_resolution.x) * 0.8)); // Clamp threshold 0.1-0.9

            // Iterate over grid cells
            for (let iy = 0; iy < GRID_Y; iy++) {
                // Calculate row-specific random factor for speed variation
                const rowRandom = random1D(1.0 + iy); // Randomness based on row index

                // Calculate velocity for this row (primarily horizontal)
                 // In GLSL: vel = vec2(u_time * 2. * max(grid.x, grid.y)) * vec2(-1., 0.0) * random(1.0 + ipos.y);
                 // We adapt this: speed depends on time, grid size, and row randomness
                 const speed = BASE_SPEED * Math.max(GRID_X, GRID_Y);
                 const velX = u_time * speed * rowRandom;
                 const vel = { x: -velX, y: 0.0 }; // Moving left

                for (let ix = 0; ix < GRID_X; ix++) {
                    const st = { x: ix, y: iy }; // Current cell coordinates

                    // Determine if the pattern is active for this cell
                    const patternActive = pattern(st, vel, threshold);

                    if (patternActive > 0.5) { // If pattern returns 1.0
                        // Select an image - cycle based on position & time, or randomly
                        const imgIndex = Math.floor(Math.abs(sin(ix * 0.1 + iy * 0.05 + u_time * 0.5)) * images.length);
                        // const imgIndex = (ix + iy * GRID_X) % images.length; // Simple cycling
                        const img = images[imgIndex % images.length]; // Ensure index is within bounds

                        // Draw the image in the cell
                        if (img && !img.error && img.complete) { // Check if it's a valid, loaded image
                             try {
                                ctx.drawImage(img, ix * cellWidth, iy * cellHeight, cellWidth, cellHeight);
                             } catch (e) {
                                 console.warn(`Error drawing image at ${ix}, ${iy}:`, e);
                                 // Optionally draw a fallback color if drawImage fails
                                 ctx.fillStyle = 'magenta';
                                 ctx.fillRect(ix * cellWidth, iy * cellHeight, cellWidth, cellHeight);
                             }
                        } else if (img && img.error) {
                             // Draw placeholder for images that failed to load
                             ctx.fillStyle = '#555'; // Grey placeholder
                             ctx.fillRect(ix * cellWidth, iy * cellHeight, cellWidth, cellHeight);
                             ctx.fillStyle = 'white';
                             ctx.fillText('ERR', ix * cellWidth + cellWidth / 4, iy * cellHeight + cellHeight / 2);
                        }
                    }
                }
            }

            // Request next frame
            animationFrameId = requestAnimationFrame(animate);
        }

        // --- Event Listeners ---
        function handleResize() {
            u_resolution.x = window.innerWidth;
            u_resolution.y = window.innerHeight;
            canvas.width = u_resolution.x;
            canvas.height = u_resolution.y;
            cellWidth = u_resolution.x / GRID_X;
            cellHeight = u_resolution.y / GRID_Y;
            // No need to redraw here, animate loop handles it
        }

        function handleMouseMove(event) {
            const rect = canvas.getBoundingClientRect();
            u_mouse.x = event.clientX - rect.left;
            u_mouse.y = event.clientY - rect.top;
        }

         function handleTouchMove(event) {
            if (event.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                u_mouse.x = event.touches[0].clientX - rect.left;
                u_mouse.y = event.touches[0].clientY - rect.top;
            }
             event.preventDefault(); // Prevent scrolling on touch devices
        }


        function handleUpdateImages() {
             const urls = imageUrlsInput.value.split(',')
                                      .map(url => url.trim())
                                      .filter(url => url.length > 0);
             if (urls.length > 0) {
                 // Stop the current animation loop before loading new images
                 if (animationFrameId) {
                     cancelAnimationFrame(animationFrameId);
                     animationFrameId = null;
                 }
                 // Load new images and restart animation
                 loadImages(urls).then(() => {
                     if (!animationFrameId) { // Start animation only if it wasn't already running
                         animate(0); // Restart animation loop
                     }
                 });
             } else {
                 alert("Please enter at least one valid image URL, separated by commas.");
             }
        }

        // --- Initialization ---
        window.addEventListener('resize', handleResize);
        canvas.addEventListener('mousemove', handleMouseMove);
         canvas.addEventListener('touchmove', handleTouchMove, { passive: false }); // Use passive: false if preventDefault is needed
        updateButton.addEventListener('click', handleUpdateImages);

        // Initial setup
        handleResize(); // Set initial canvas size
        handleUpdateImages(); // Load initial images specified in the input field

    </script>
</body>
</html>
